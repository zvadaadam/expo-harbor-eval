description = "Expo code-gen eval authored from a field-reported failure of popular navigation-title guidance."
authors = [{ name = "Expo Harbor Evals" }]
keywords = ["react-native", "expo", "harbor", "codegen", "llm-judge", "expo-feedback"]

[metadata]
family = "expo-codegen"
