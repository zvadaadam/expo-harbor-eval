tier = "code-gen"
difficulty = "medium"
motivation = "Expo skills feedback bca74ecdb803 (expo-native-ui), second finding: 'ALWAYS use a navigation stack title instead of a custom text element' is unachievable for multi-color headlines, and the common workaround (headerShown: false plus a page-level headline) silently discards native stack behaviors. The right escape hatch is a custom headerTitle component inside the native header."
source = "expo-skills-feedback"
feedback_id = "bca74ecdb803"
distractor = "Meets the two-tone design with headerShown: false and a page-level headline padded by a magic number — the common workaround that loses the native header."
requirements = 3
verifier = "rewardkit-weighted-binary"

