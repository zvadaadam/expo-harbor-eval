motivation = "Reconstructed from an Android 360dp report where web validation missed a width/flex conflict. The original source and exact patch were not supplied. This fixture reproduces collapse of the amount column under native Yoga defaults while the same styles preserve its width under useWebDefaults. RN 0.86.3 Node.cpp and Yoga 3.2.1 confirm positive flex and flex-basis/default-shrink semantics. It measures resolving rendered native layout constraints, not memorizing a ban on flex shorthand. The headless Yoga check uses stipulated text metrics, not an Android screenshot or the exact RN-bundled Yoga build."
