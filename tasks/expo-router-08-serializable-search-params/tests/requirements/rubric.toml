[judge]
judge = "anthropic/claude-sonnet-4-6"
files = ["/app"]
prompt_template = "judge-prompt.md"
timeout = 300
reasoning_effort = "medium"

[[criterion]]
name = "link-carries-id-and-tab"
id = "link-carries-id-and-tab"
description = "The Open details link must carry both the product id and the selected tab (from the PRODUCT constant) as route params to the details screen."
type = "binary"
weight = 1

[[criterion]]
name = "uses-local-search-params"
id = "uses-local-search-params"
description = "Must read route params with useLocalSearchParams or useGlobalSearchParams from expo-router."
type = "binary"
weight = 1

[[criterion]]
name = "param-fallbacks"
id = "param-fallbacks"
description = "Must handle missing params (e.g. a direct deep link) with fallback values instead of rendering blanks."
type = "binary"
weight = 1

[[criterion]]
name = "no-object-function-params"
id = "no-object-function-params"
description = "Must not pass functions, class instances, or non-serializable objects as route params; the carried params must be serializable primitives."
type = "binary"
weight = 1

[scoring]
aggregation = "weighted_mean"
