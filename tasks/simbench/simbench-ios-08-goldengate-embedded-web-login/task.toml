schema_version = "1.3"

[task]
name = "expo-harbor/simbench-ios-08-goldengate-embedded-web-login"
description = "Sign in through GoldenGate's in-app HarborID web sheet (WKWebView): login then access-consent, verified from app + provider state, no LLM judge."
authors = [{ name = "Expo evals" }]
keywords = ["expo", "ios", "simulator", "simbench", "oauth", "webview"]

[metadata]
family = "simbench"
motivation = "OAuth tier (customer signal 2026-09: agents fail operating sign-in flows on the simulator). Embedded surface: an in-app WKWebView login + consent, the simplest of the three OAuth surfaces because the web form stays in-process and reads as a semantic tree. Pairs with the system-auth-session and browser-handoff tasks over the same GoldenGate app."
category = "simbench"
difficulty = "medium"
tier = "embedded-web-form"
requires = ["macos-host", "xcode-simulator", "agent-device-cli"]
verifier = "app-state-programmatic"
validation_status = "requires-simulator-calibration"
driver_tool = "agent-device"

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
workdir = "/app"

# Per-trial readiness doubles as setup: boots the simulator and reinstalls the
# golden app fresh so every trial starts from a clean data container.
[environment.healthcheck]
command = "bash /app/driver/setup.sh"
timeout_sec = 600.0
retries = 2
