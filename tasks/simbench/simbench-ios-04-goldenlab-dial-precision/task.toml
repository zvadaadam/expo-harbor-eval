schema_version = "1.3"

[task]
name = "expo-harbor/simbench-ios-04-goldenlab-dial-precision"
description = "Set a slider to an exact value and save it; fine adjustment defeats naive drags. Verified from app state, no LLM judge."
authors = [{ name = "Expo evals" }]
keywords = ["expo", "ios", "simulator", "simbench", "gesture-precision"]

[metadata]
family = "simbench"
motivation = "Expo simulator-use benchmark: compare model x driver-tool stacks (agent-device, argent, ...) on verifiable simulator tasks; internal thread 2026-07 (szymon/david/brent)"
category = "simbench"
difficulty = "hard"
tier = "gesture-precision"
requires = ["macos-host", "xcode-simulator"]
verifier = "app-state-programmatic"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
workdir = "/app"

# Per-trial readiness doubles as setup: boots the simulator and reinstalls the
# golden app fresh so every trial starts from a clean data container.
[environment.healthcheck]
command = "bash /app/driver/setup.sh"
timeout_sec = 600.0
retries = 2
