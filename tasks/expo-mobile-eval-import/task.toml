schema_version = "1.3"

[task]
name = "expo/mobile-eval-import"
description = "Normalize an Expo agentic evaluator result.json into Harbor reward.json."
authors = [{ name = "Expo evals" }]
keywords = ["expo", "ios", "mobile", "harbor", "eas"]

[metadata]
category = "mobile-eval"
difficulty = "easy"
tags = ["expo", "eas-bridge", "result-import"]

[agent]
timeout_sec = 5.0

[verifier]
timeout_sec = 120.0

[verifier.env]
EVAL_RESULT_PATH = "${EVAL_RESULT_PATH:-}"
MOBILE_EVAL_COMMAND = "${MOBILE_EVAL_COMMAND:-}"

[environment]
build_timeout_sec = 600.0
workdir = "/app"
cpus = 1
memory_mb = 1024
storage_mb = 1024
