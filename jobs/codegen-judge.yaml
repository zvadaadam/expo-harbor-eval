# LLM-judged eval of every expo-codegen task, comparing the untouched
# baseline app (nop) against the reference solution (oracle).
# Judge selection:
#   REWARDKIT_JUDGE unset        -> rubric default (anthropic/claude-sonnet-4-6,
#                                   needs ANTHROPIC_API_KEY)
#   REWARDKIT_JUDGE=<litellm-id> -> that model (needs its provider key)
#   REWARDKIT_JUDGE=claude-code  -> local `claude` CLI as agent judge
jobs_dir: runs
n_attempts: 3
timeout_multiplier: 1.0
n_concurrent_trials: 3
quiet: false

environment:
  import_path: expo_harbor_evals.mac_sandbox_env:MacSandboxEnvironment
  delete: true

verifier:
  env:
    EXPO_EVAL_VERIFIER_MODE: judge
    REWARDKIT_JUDGE: "${REWARDKIT_JUDGE:-claude-code}"
    REWARDKIT_MODEL: "${REWARDKIT_MODEL:-claude-opus-4-8}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

agents:
  - name: nop
  - name: oracle

datasets:
  - path: tasks
    task_names:
      - expo-sdk-04-image-picker-canceled-assets-guard
      - expo-sdk-10-notifications-listener-cleanup
      - expo-sdk-12-filesystem-object-api-read-write
      - expo-router-02-stack-layout-not-native-stack-import
      - expo-router-07-protected-routes-auth
      - expo-router-08-serializable-search-params
      - expo-ui-01-universal-layout-controls
      - expo-ui-02-bottom-sheet-controlled
      - expo-ui-06-native-state-text-input
      - expo-feedback-01-transparent-header-content-inset
