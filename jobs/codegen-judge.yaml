# LLM-judged eval of every expo-codegen task, comparing the untouched
# baseline app (nop) against the reference solution (oracle).
# Judge selection (the env default below makes claude-code the effective
# default; the rubric's own judge field is only reached by exporting it):
#   REWARDKIT_JUDGE unset        -> claude-code: local logged-in `claude` CLI,
#                                   pinned to claude-opus-4-8 for comparability
#   REWARDKIT_JUDGE=<litellm-id> -> that model (needs its provider key)
jobs_dir: runs
n_attempts: 3
timeout_multiplier: 1.0
n_concurrent_trials: 3
quiet: false

environment:
  import_path: expo_harbor_evals.mac_sandbox_env:MacSandboxEnvironment
  delete: true

verifier:
  env:
    EXPO_EVAL_VERIFIER_MODE: judge
    REWARDKIT_JUDGE: "${REWARDKIT_JUDGE:-claude-code}"
    REWARDKIT_MODEL: "${REWARDKIT_MODEL:-claude-opus-4-8}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

agents:
  - name: nop
  - name: oracle

datasets:
  - path: tasks
    # Family globs (fnmatch on task directory names): every expo-codegen
    # task joins automatically; expo-mobile-eval-import does not match.
    task_names:
      - "expo-sdk-*"
      - "expo-router-*"
      - "expo-ui-*"
      - "expo-feedback-*"
