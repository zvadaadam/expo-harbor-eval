# Unguided-driver condition. Same installed tools, without a driver recipe in
# the preface; this measures guidance/discovery, not tool unavailability.
jobs_dir: runs
n_attempts: 3
timeout_multiplier: 1.0
n_concurrent_trials: 1
quiet: false

environment:
  import_path: expo_harbor_evals.simbench_env:SimbenchEnvironment
  delete: true

agents:
  - name: nop
  - name: oracle
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: "haiku#unguided"
    kwargs:
      allowed_tools: "Bash Read Write Edit Glob Grep LS TodoWrite"
      preface: &notool_preface |
        You are operating directly on the macOS host for this task. Your
        working directory is the task workspace (called /app in the
        instructions).

        No simulator driver workflow is prescribed for this run. The host has the
        standard POSIX shell utilities and the full Xcode command-line
        toolchain, including `xcrun simctl` and its subcommands (list, boot,
        launch, terminate, openurl, io screenshot, ui, spawn, and the rest).
        The trial simulator is already booted. Its UDID is in the
        SIMBENCH_DEVICE environment variable; target that device explicitly.

  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: "sonnet#unguided"
    kwargs:
      allowed_tools: "Bash Read Write Edit Glob Grep LS TodoWrite"
      preface: *notool_preface

datasets:
  - path: tasks/simbench
    task_names:
      - simbench-ios-01-goldennotes-create-note
      - simbench-ios-02-inventory-scroll-claim
      - simbench-ios-03-register-occluded-form
