jobs_dir: runs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 3
quiet: false

environment:
  import_path: expo_harbor_evals.local_env:LocalHostEnvironment
  delete: true

verifier:
  env:
    EXPO_EVAL_VERIFIER_MODE: reference

agents:
  - name: oracle

datasets:
  - path: tasks
    task_names:
      - callstack-expo-sdk-04-rn-expo-image-picker-canceled-assets-guard
      - callstack-expo-sdk-10-rn-expo-notifications-listener-cleanup
      - callstack-expo-sdk-12-rn-expo-filesystem-object-api-read-write
      - callstack-expo-router-02-rn-expo-router-stack-layout-not-native-stack-import
      - callstack-expo-router-07-rn-expo-router-protected-routes-auth
      - callstack-expo-router-08-rn-expo-router-serializable-search-params
      - callstack-expo-ui-01-rn-expo-ui-universal-layout-controls
      - callstack-expo-ui-02-rn-expo-ui-bottom-sheet-controlled
      - callstack-expo-ui-06-rn-expo-ui-native-state-text-input
