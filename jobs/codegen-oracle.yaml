jobs_dir: runs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 3
quiet: false

environment:
  import_path: expo_harbor_evals.local_env:LocalHostEnvironment
  delete: true

verifier:
  env:
    EXPO_EVAL_VERIFIER_MODE: reference

agents:
  - name: oracle

datasets:
  # The directory is the cohort: every task under tasks/codegen/ joins.
  - path: tasks/codegen
