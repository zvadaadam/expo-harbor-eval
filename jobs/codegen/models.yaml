# Model/effort ladder over the expo-codegen tasks using the host's logged-in
# claude CLI (see expo_harbor_evals.claude_host_agent). Model ladder runs at
# low effort; haiku@high isolates the reasoning-effort axis on the weakest
# model. Judged by the same claude-code judge as jobs/codegen/judge.yaml so
# results are comparable; merge runs with:
#   uv run expo-eval-report runs/codegen-judge runs/codegen-models
jobs_dir: runs
n_attempts: 3
timeout_multiplier: 1.0
n_concurrent_trials: 3
quiet: false

environment:
  import_path: expo_harbor_evals.mac_sandbox_env:MacSandboxEnvironment
  delete: true

verifier:
  env:
    EXPO_EVAL_VERIFIER_MODE: judge
    REWARDKIT_JUDGE: claude-code
    REWARDKIT_MODEL: "${REWARDKIT_MODEL:-claude-opus-4-8}"

agents:
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: haiku@low
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: haiku@high
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: sonnet@low
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: opus@low
  - import_path: expo_harbor_evals.claude_host_agent:ClaudeHostAgent
    model_name: fable@low

datasets:
  # Frozen cohort; update deliberately alongside suites/mobile-v2.json.
  - path: tasks/codegen
    task_names:
      - feedback-01-transparent-header-content-inset
      - feedback-02-styled-title-keeps-native-stack
      - feedback-03-shop-grid-sticky-header
      - feedback-04-modal-editor-touch-freeze
      - feedback-05-slider-relative-recenter
      - feedback-06-sortable-grid-stable-layers
      - feedback-08-modal-keyboard-viewport
      - feedback-09-invite-links-web-fallback
      - feedback-10-three-scene-cargo-cult
      - router-02-stack-layout-not-native-stack-import
      - router-07-protected-routes-auth
      - router-08-serializable-search-params
      - sdk-04-image-picker-canceled-assets-guard
      - sdk-10-notifications-listener-cleanup
      - sdk-12-filesystem-object-api-read-write
      - ui-01-universal-layout-controls
      - ui-02-bottom-sheet-controlled
      - ui-06-native-state-text-input
