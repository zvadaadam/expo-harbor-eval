[project]
name = "expo-harbor-evals"
version = "0.1.0"
description = "Harbor tasks and utilities for Expo mobile evaluator results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor>=0.16.1",
  "pyyaml>=6.0.2",
  "tomli-w>=1.2.0",
]

[project.scripts]
expo-eval-score = "expo_harbor_evals.score_result:main"
expo-eas-import = "expo_harbor_evals.import_eas_eval_artifact:main"
expo-callstack-import = "expo_harbor_evals.callstack_adapter:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true
