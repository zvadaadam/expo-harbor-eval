[project]
name = "expo-harbor-evals"
version = "0.1.0"
description = "Expo coding and simulator-operation benchmarks with Harbor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor>=0.16.1",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.2",
  "tomli-w>=1.2.0",
]

[project.scripts]
expo-eval-report = "expo_harbor_evals.report:main"
expo-eval-viewer = "expo_harbor_evals.viewer:main"
expo-eval-export = "expo_harbor_evals.export:main"
expo-codegen-calibrate = "expo_harbor_evals.codegen_calibrate:main"
expo-simbench-calibrate = "expo_harbor_evals.simbench_calibrate:main"
expo-eas-eval = "expo_harbor_evals.eas_runner:main"
expo-mobile-eval = "expo_harbor_evals.mobile_eval:main"
expo-mobile-calibrate = "expo_harbor_evals.mobile_calibrate:main"
expo-eval-suite = "expo_harbor_evals.evaluation_identity:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true
